<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 200" preserveAspectRatio="none">
  <defs>
    <!-- Gradien animasi warna -->
    <linearGradient id="hg1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%">
        <animate attributeName="stop-color" values="#6C63FF;#FF6B6B;#6C63FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%">
        <animate attributeName="stop-color" values="#00D2FF;#FFD93D;#00D2FF" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="hg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="hg3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Jalur partikel -->
    <path id="hWavePath" d="M0,100 C240,50 480,150 720,100 C960,50 1200,150 1440,100"/>
  </defs>

  <!-- Lapisan belakang -->
  <path fill="url(#hg3)" d="M0,200 L0,100 C240,50 480,150 720,100 C960,50 1200,150 1440,100 L1440,200 Z">
    <animate attributeName="d" dur="15s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"
      values="
        M0,200 L0,100 C240,50 480,150 720,100 C960,50 1200,150 1440,100 L1440,200 Z;
        M0,200 L0,120 C240,80 480,100 720,130 C960,160 1200,100 1440,80 L1440,200 Z;
        M0,200 L0,100 C240,50 480,150 720,100 C960,50 1200,150 1440,100 L1440,200 Z
      "/>
  </path>

  <!-- Lapisan tengah -->
  <path fill="url(#hg2)" d="M0,200 L0,100 C240,50 480,150 720,100 C960,50 1200,150 1440,100 L1440,200 Z">
    <animate attributeName="d" dur="10s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"
      values="
        M0,200 L0,100 C240,50 480,150 720,100 C960,50 1200,150 1440,100 L1440,200 Z;
        M0,200 L0,90 C240,130 480,70 720,110 C960,130 1200,70 1440,120 L1440,200 Z;
        M0,200 L0,100 C240,50 480,150 720,100 C960,50 1200,150 1440,100 L1440,200 Z
      "/>
  </path>

  <!-- Lapisan depan -->
  <path fill="url(#hg1)" d="M0,200 L0,100 C240,50 480,150 720,100 C960,50 1200,150 1440,100 L1440,200 Z">
    <animate attributeName="d" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"
      values="
        M0,200 L0,100 C240,50 480,150 720,100 C960,50 1200,150 1440,100 L1440,200 Z;
        M0,200 L0,80 C240,140 480,60 720,90 C960,120 1200,80 1440,110 L1440,200 Z;
        M0,200 L0,100 C240,50 480,150 720,100 C960,50 1200,150 1440,100 L1440,200 Z
      "/>
  </path>

  <!-- Partikel berenang -->
  <circle r="4" fill="white" opacity="0.9">
    <animateMotion dur="8s" repeatCount="indefinite">
      <mpath href="#hWavePath"/>
    </animateMotion>
  </circle>
  <circle r="2.5" fill="#FFD93D" opacity="0.9">
    <animateMotion dur="8s" repeatCount="indefinite" begin="2s">
      <mpath href="#hWavePath"/>
    </animateMotion>
  </circle>
  <circle r="5" fill="#00D2FF" opacity="0.6">
    <animateMotion dur="8s" repeatCount="indefinite" begin="4s">
      <mpath href="#hWavePath"/>
    </animateMotion>
  </circle>
  <circle r="3" fill="#ffffff" opacity="0.7">
    <animateMotion dur="8s" repeatCount="indefinite" begin="6s">
      <mpath href="#hWavePath"/>
    </animateMotion>
  </circle>
</svg>
